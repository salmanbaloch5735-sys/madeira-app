name: Build Unsigned IPA for SideStore
on: 
  workflow_dispatch: # Gives you a manual "Run" button

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Build App Archive (No Signing)
        run: |
          PROJECT=$(ls -d *.xcodeproj 2>/dev/null | head -n 1)
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -n 1)
          
          if [ -n "$WORKSPACE" ]; then
            NAME=$(basename "$WORKSPACE" .xcworkspace)
            TARGET_FLAG="-workspace $WORKSPACE"
          elif [ -n "$PROJECT" ]; then
            NAME=$(basename "$PROJECT" .xcodeproj)
            TARGET_FLAG="-project $PROJECT"
          else
            echo "❌ No Xcode project or workspace found!"
            exit 1
          fi

          SCHEME=$(xcodebuild -list $TARGET_FLAG | sed -n '/Schemes:/,$p' | sed -1,2d | tr -d ' ' | head -n 1)
          echo "Building Scheme: $SCHEME"

          xcodebuild archive \
            $TARGET_FLAG \
            -scheme "$SCHEME" \
            -archivePath build/Madeira.xcarchive \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Convert Archive to Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Madeira.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r Madeira_Unsigned.ipa Payload/

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-Unsigned-IPA
          path: build/Madeira_Unsigned.ipa
