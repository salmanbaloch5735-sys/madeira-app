name: Build Unsigned IPA v2
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Build App Archive (No Signing)
        run: |
          PROJECT=$(find . -name "*.xcodeproj" -maxdepth 3 | head -n 1)
          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 3 | head -n 1)
          
          if [ -n "$WORKSPACE" ]; then
            PROJECT_DIR=$(dirname "$WORKSPACE")
            NAME=$(basename "$WORKSPACE" .xcworkspace)
            TARGET_FLAG="-workspace $(basename "$WORKSPACE")"
          elif [ -n "$PROJECT" ]; then
            PROJECT_DIR=$(dirname "$PROJECT")
            NAME=$(basename "$PROJECT" .xcodeproj)
            TARGET_FLAG="-project $(basename "$PROJECT")"
          else
            echo "❌ No Xcode project or workspace found anywhere in the repository!"
            exit 1
          fi

          cd "$PROJECT_DIR"
          echo "Moved into project directory: $PROJECT_DIR"

          SCHEME=$(xcodebuild -list $TARGET_FLAG | sed -n '/Schemes:/,$p' | sed -1,2d | tr -d ' ' | head -n 1)
          echo "Building Scheme: $SCHEME"

          xcodebuild archive \
            $TARGET_FLAG \
            -scheme "$SCHEME" \
            -archivePath ../build/Madeira.xcarchive \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Convert Archive to Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Madeira.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r Madeira_Unsigned.ipa Payload/

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-Unsigned-IPA
          path: build/Madeira_Unsigned.ipa
